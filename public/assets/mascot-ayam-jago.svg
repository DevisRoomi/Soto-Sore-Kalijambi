<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4a2511" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Mangkok Putih Khas Ayam Jago -->
  <g filter="url(#shadow)">
    <!-- Badan Mangkok Utama -->
    <path d="M 28 66 C 30 110, 52 132, 80 132 C 108 132, 130 110, 132 66 Z" fill="#fffdf9" stroke="#33241b" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Kaki/Tatapan Mangkok -->
    <path d="M 58 132 L 56 142 L 104 142 L 102 132 Z" fill="#f4ebd9" stroke="#33241b" stroke-width="4" stroke-linejoin="round"/>

    <!-- Bibir Mangkok Atas Bergaris Merah -->
    <ellipse cx="80" cy="66" rx="52" ry="12" fill="#fffdf9" stroke="#33241b" stroke-width="4.5"/>
    <ellipse cx="80" cy="66" rx="49" ry="9" fill="none" stroke="#ba3222" stroke-width="2.5"/>

    <!-- Isi Kuah Kuning Gurih & Mie Hangat -->
    <ellipse cx="80" cy="67" rx="44" ry="7.5" fill="#f5c258"/>
    <!-- Lembaran Daun Bawang / Seledri Segar -->
    <ellipse cx="64" cy="66" rx="3.5" ry="1.8" fill="#3f8244" transform="rotate(-15 64 66)"/>
    <ellipse cx="94" cy="67" rx="4" ry="2" fill="#3f8244" transform="rotate(25 94 67)"/>
    <ellipse cx="80" cy="68" rx="3" ry="1.5" fill="#8c5828"/>

    <!-- Lukisan Ayam Jago Khas di Badan Mangkok -->
    <!-- Ekor Ayam Hitam Melengkung Gagah -->
    <path d="M 51 98 Q 42 90 42 78 Q 46 86 54 90" fill="#201b18"/>
    <path d="M 48 102 Q 38 96 36 86 Q 44 92 51 97" fill="#201b18"/>
    
    <!-- Badan Ayam Jago Hitam-Abu -->
    <path d="M 52 92 C 54 84, 62 82, 68 86 C 73 90, 72 102, 63 105 C 56 105, 51 100, 52 92 Z" fill="#2c221d"/>
    <!-- Sayap & Dada Merah Ayam Jago -->
    <path d="M 60 88 C 65 87, 70 91, 68 98 C 65 101, 58 100, 58 93 Z" fill="#c4281b"/>

    <!-- Leher & Kepala Ayam Jago -->
    <path d="M 67 85 C 69 79, 73 77, 76 77 C 76 81, 74 85, 71 87 Z" fill="#2c221d"/>
    <!-- Paruh Kuning -->
    <polygon points="76,79 81,81 76,83" fill="#e59e1b"/>
    <!-- Jengger Merah Khas Ayam Jago -->
    <path d="M 73 76 Q 74 71 77 72 Q 78 75 76 77 Z" fill="#d92518"/>
    <circle cx="78" cy="74" r="1.8" fill="#d92518"/>
    <!-- Gelambir Bawah Paruh -->
    <path d="M 76 83 Q 75 86 73 84 Z" fill="#d92518"/>

    <!-- Bunga Peony & Daun Khas Mangkok Ayam Tradisional -->
    <circle cx="92" cy="95" r="7" fill="#d93b30"/>
    <circle cx="97" cy="98" r="5" fill="#e86154"/>
    <circle cx="89" cy="99" r="4.5" fill="#b52b22"/>
    <!-- Daun Hijau di Samping Bunga -->
    <path d="M 103 93 Q 112 91 113 97 Q 106 99 101 96 Z" fill="#3b7a3e"/>
    <path d="M 97 106 Q 104 112 99 115 Q 95 109 96 104 Z" fill="#3b7a3e"/>

    <!-- Tangan Karakter Mengangkat Sumpit & Mie -->
    <path d="M 104 52 L 68 36" stroke="#c88344" stroke-width="3" stroke-linecap="round"/>
    <path d="M 106 56 L 66 42" stroke="#b06f34" stroke-width="3" stroke-linecap="round"/>
    <!-- Untaian Mie Terangkat Hangat -->
    <path d="M 72 40 Q 75 52 74 65" fill="none" stroke="#f6ce6d" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 77 42 Q 79 54 82 66" fill="none" stroke="#f0c258" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 82 43 Q 86 52 86 65" fill="none" stroke="#f6ce6d" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Uap Panas Mengepul Hangat -->
    <path d="M 60 28 Q 55 18 62 10" fill="none" stroke="#d48a55" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 78 24 Q 72 15 80 7" fill="none" stroke="#ba3222" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 96 28 Q 102 18 95 10" fill="none" stroke="#d48a55" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>